<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Responsive Crossword — Phaser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      /* ----------- GLOBAL LAYOUT & COLORS ----------- */
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #071322;
        color: #e6eef6;
        overflow-x: hidden;
      }

      /* Flex layout: crossword grid + UI */
      .wrap {
        display: flex;
        gap: 14px;
        padding: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* Game container */
      #game {
        background: linear-gradient(180deg, #06121a, #03202a);
        padding: 12px;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: hidden; /* prevent tiny overflow */
      }

      /* Force the Phaser canvas to fit properly */
      #game canvas {
        max-width: 100% !important;
        width: 100% !important;
        height: auto !important;
        display: block;
      }

      /* Right panel for clues */
      #ui {
        width: 360px;
        min-width: 260px;
        background: #071724;
        padding: 12px;
        border-radius: 8px;
      }

      h2 {
        margin: 0 0 8px 0;
      }

      ol {
        padding-left: 18px;
        margin: 8px 0;
        color: #9aa6b2;
      }

      li {
        margin: 6px 0;
        cursor: pointer;
      }

      li.active {
        color: #fff;
        background: rgba(255, 216, 107, 0.06);
        padding: 4px;
        border-radius: 4px;
      }

      /* Simple button */
      button {
        background: #0b1320;
        border: 1px solid rgba(255, 255, 255, 0.04);
        color: #cbd5e1;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Continue button */
      .continue-btn {
        display: none;
        background: linear-gradient(90deg, #4ade80, #16a34a);
        color: #fff;
        border: none;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.25s ease;
        margin-top: 16px;
        width: 100%;
      }

      .continue-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
      }

      .hint {
        margin-top: 8px;
        color: #9aa6b2;
        font-size: 13px;
      }

      /* Responsive stacking */
      @media (max-width: 920px) {
        .wrap {
          flex-direction: column;
          align-items: center;
        }

        #ui {
          width: 92%;
          max-width: 760px;
          margin-top: 12px;
        }

        #game {
          max-width: 92%;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div id="game"></div>

      <div id="ui">
        <h2>Crossword</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div>
            <strong>Across</strong>
            <ol id="acrossList"></ol>
          </div>
          <div>
            <strong>Down</strong>
            <ol id="downList"></ol>
          </div>
        </div>

        <div style="margin-top: 8px">
          <button id="toggleDir">Toggle Dir (Space)</button>
        </div>

        <div class="hint">
          Tap a cell, type letters (A–Z). Arrow keys move. Space toggles
          across/down. Words auto-validate when completely filled.
        </div>

        <button id="nextBtn" class="continue-btn">Continue</button>
      </div>
    </div>

    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <script>
      /* ===============================
         GAME DATA AND PUZZLE CONFIG
         =============================== */

      // Crossword grid (10x10)
      const solutionGrid = [
        "ENCRYPT###",
        "#####E####",
        "DDOS#N#F##",
        "##U##D#T##",
        "##DECRYPT#",
        "#####I##R#",
        "##D##V##O#",
        "#HACKER#J#",
        "##T#####A#",
        "##A#####N#",
      ];

      // Across clues
      const acrossClues = {
        1: { r: 0, c: 0, len: 7, clue: "Turn data into unreadable form.", answer: "ENCRYPT" },
        2: { r: 2, c: 0, len: 4, clue: "Distributed network attack (abbr.).", answer: "DDOS" },
        3: { r: 4, c: 2, len: 7, clue: "Opposite of encrypt.", answer: "DECRYPT" },
        4: { r: 7, c: 1, len: 6, clue: "Someone who breaks into systems.", answer: "HACKER" },
      };

      // Down clues
      const downClues = {
        5: { r: 0, c: 5, len: 8, clue: "Portable USB storage (two words joined).", answer: "PENDRIVE" },
        6: { r: 2, c: 7, len: 3, clue: "File Transfer Protocol.", answer: "FTP" },
        7: { r: 4, c: 8, len: 6, clue: "Malware that hides in files (6).", answer: "TROJAN" },
      };

      const ROWS = 10, COLS = 10;
      const STORAGE_KEY = "responsive_crossword_v2";
      let phaserGame = null;
      let crosswordSolved = false;

      /* ===============================
         RESPONSIVE PHASER GAME CREATOR
         =============================== */
      function createGameForContainer() {
        const container = document.getElementById("game");
        const rect = container.getBoundingClientRect();
        const containerWidth = Math.max(260, Math.floor(rect.width));

        const innerPad = 18 * 2; // padding safety
        const maxGridWidth = Math.max(0, containerWidth - innerPad);
        const tile = Math.floor(maxGridWidth / COLS) || 36;
        const tileClamped = Math.max(36, Math.min(56, tile)); // clamp tile size

        const canvasWidth = tileClamped * COLS + innerPad;
        const canvasHeight = tileClamped * ROWS + innerPad + 24;

        window._CROSSWORD_CFG = { tile: tileClamped, canvasWidth, canvasHeight };

        // Destroy any previous Phaser instance
        if (phaserGame) {
          try { phaserGame.destroy(true); } catch (e) {}
          phaserGame = null;
        }

        // Phaser configuration
        const config = {
          type: Phaser.AUTO,
          parent: "game",
          width: canvasWidth,
          height: canvasHeight,
          backgroundColor: "#06121a",
          scene: [CrosswordScene],
          scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
        };

        phaserGame = new Phaser.Game(config);
      }

      /* ===============================
         MAIN PHASER SCENE
         =============================== */
      class CrosswordScene extends Phaser.Scene {
        constructor() {
          super({ key: "CrosswordScene" });
        }

        create() {
          const { tile, canvasWidth } = window._CROSSWORD_CFG;
          const pad = 6;
          this.baseX = (canvasWidth - tile * COLS) / 2;
          this.baseY = 12;

          // Create cell matrix
          this.cells = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
          this.direction = "across";
          this.selected = { r: 0, c: 0 };

          for (let r = 0; r < ROWS; r++) {
            const rowStr = solutionGrid[r];
            for (let c = 0; c < COLS; c++) {
              const ch = rowStr[c];
              const isBlocked = ch === "#";

              // Detect if cell is part of any clue; if not, gray it out
              const partOfAcross = Object.values(acrossClues).some(cl => cl.r === r && c >= cl.c && c < cl.c + cl.len);
              const partOfDown = Object.values(downClues).some(cl => cl.c === c && r >= cl.r && r < cl.r + cl.len);
              const isGrayLocked = !isBlocked && !partOfAcross && !partOfDown;

              const x = this.baseX + c * tile + tile / 2;
              const y = this.baseY + r * tile + tile / 2;
              const color = isBlocked || isGrayLocked ? 0x374151 : 0xffffff;

              const rect = this.add.rectangle(x, y, tile - pad, tile - pad, color).setStrokeStyle(2, 0x07121a);
              const text = this.add.text(x, y, "", { font: `${tile * 0.42}px monospace`, color: "#000" }).setOrigin(0.5);

              this.cells[r][c] = { rect, text, solution: isBlocked ? null : ch, isBlocked, isGrayLocked };

              // Make interactive only if it's not blocked or gray locked
              if (!isBlocked && !isGrayLocked) rect.setInteractive().on("pointerdown", () => this.selectCell(r, c));
            }
          }

          // Select the first active cell
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              if (!this.cells[r][c].isBlocked && !this.cells[r][c].isGrayLocked) {
                this.selectCell(r, c);
                r = ROWS;
                break;
              }
            }
          }

          // Keyboard input
          this.input.keyboard.on("keydown", evt => {
            const k = evt.key;
            if (k === " ") return this.toggleDirection();
            if (/^[a-zA-Z]$/.test(k)) return this.putLetter(k.toUpperCase());
            if (k.startsWith("Arrow")) return this.move(k.replace("Arrow", "").toLowerCase());
            if (k === "Backspace") return this.erase();
          });

          this.renderClues();
        }

        selectCell(r, c) {
          if (this.cells[r][c].isBlocked || this.cells[r][c].isGrayLocked) return;
          this.clearHighlights();
          this.selected = { r, c };
          this.cells[r][c].rect.setFillStyle(0xfffbcc);
          this.highlightActiveWord();
        }

        clearHighlights() {
          for (let r = 0; r < ROWS; r++)
            for (let c = 0; c < COLS; c++) {
              const cell = this.cells[r][c];
              if (!cell.isBlocked && !cell.isGrayLocked) cell.rect.setFillStyle(0xffffff);
            }
        }

        toggleDirection() {
          this.direction = this.direction === "across" ? "down" : "across";
          this.highlightActiveWord();
        }

        getWordCells() {
          const { r, c } = this.selected;
          const cells = [];
          if (this.direction === "across") {
            let sc = c; while (sc > 0 && !this.cells[r][sc - 1].isBlocked) sc--;
            let ec = c; while (ec < COLS && !this.cells[r][ec].isBlocked) ec++;
            for (let cc = sc; cc < ec; cc++) cells.push({ r, c: cc });
          } else {
            let sr = r; while (sr > 0 && !this.cells[sr - 1][c].isBlocked) sr--;
            let er = r; while (er < ROWS && !this.cells[er][c].isBlocked) er++;
            for (let rr = sr; rr < er; rr++) cells.push({ r: rr, c });
          }
          return cells;
        }

        highlightActiveWord() {
          const cells = this.getWordCells();
          cells.forEach(({ r, c }) => {
            const cell = this.cells[r][c];
            if (!cell.isBlocked && !cell.isGrayLocked) cell.rect.setFillStyle(0xe8f3ff);
          });
          const s = this.selected;
          this.cells[s.r][s.c].rect.setFillStyle(0xfffbcc);
        }

        putLetter(letter) {
          const { r, c } = this.selected;
          const cell = this.cells[r][c];
          if (cell.isBlocked || cell.isGrayLocked) return;
          cell.text.setText(letter);
          this.validateWord();
          this.moveNext();
        }

        moveNext() {
          const { r, c } = this.selected;
          if (this.direction === "across") {
            for (let nc = c + 1; nc < COLS; nc++)
              if (!this.cells[r][nc].isBlocked && !this.cells[r][nc].isGrayLocked) return this.selectCell(r, nc);
          } else {
            for (let nr = r + 1; nr < ROWS; nr++)
              if (!this.cells[nr][c].isBlocked && !this.cells[nr][c].isGrayLocked) return this.selectCell(nr, c);
          }
        }

        erase() {
          const { r, c } = this.selected;
          this.cells[r][c].text.setText("");
        }

        validateWord() {
          const wordCells = this.getWordCells();
          const word = wordCells.map(({ r, c }) => this.cells[r][c].text.text || "").join("");
          const clueList = this.direction === "across" ? acrossClues : downClues;
          const clue = Object.values(clueList).find(cl =>
            cl.len === wordCells.length &&
            ((this.direction === "across" && cl.r === wordCells[0].r && cl.c === wordCells[0].c) ||
             (this.direction === "down" && cl.c === wordCells[0].c && cl.r === wordCells[0].r))
          );
          if (!clue || word.length < clue.len) return;
          const correct = word.toUpperCase() === clue.answer.toUpperCase();
          wordCells.forEach(({ r, c }) => {
            this.cells[r][c].rect.setFillStyle(correct ? 0xccffcc : 0xffcccc);
          });
          this.checkPuzzleComplete();
        }

        move(dir) {
          let { r, c } = this.selected;
          if (dir === "left") c = Math.max(0, c - 1);
          if (dir === "right") c = Math.min(COLS - 1, c + 1);
          if (dir === "up") r = Math.max(0, r - 1);
          if (dir === "down") r = Math.min(ROWS - 1, r + 1);
          if (!this.cells[r][c].isBlocked && !this.cells[r][c].isGrayLocked) this.selectCell(r, c);
        }

        checkPuzzleComplete() {
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const cell = this.cells[r][c];
              if (cell.isBlocked || cell.isGrayLocked) continue;
              const entered = (cell.text.text || "").toUpperCase();
              if (entered !== cell.solution.toUpperCase()) return false;
            }
          }
          document.getElementById("nextBtn").style.display = "block";
          crosswordSolved = true;
          return true;
        }

        renderClues() {
          const across = document.getElementById("acrossList");
          const down = document.getElementById("downList");
          across.innerHTML = "";
          down.innerHTML = "";
          Object.entries(acrossClues).forEach(([id, cl]) => {
            const li = document.createElement("li");
            li.textContent = `${id}. ${cl.clue} (${cl.len})`;
            li.onclick = () => { this.direction = "across"; this.selectCell(cl.r, cl.c); };
            across.appendChild(li);
          });
          Object.entries(downClues).forEach(([id, cl]) => {
            const li = document.createElement("li");
            li.textContent = `${id}. ${cl.clue} (${cl.len})`;
            li.onclick = () => { this.direction = "down"; this.selectCell(cl.r, cl.c); };
            down.appendChild(li);
          });
        }
      }

      /* ===============================
         INITIALIZATION
         =============================== */
      window.addEventListener("load", () => {
        createGameForContainer();
        window.addEventListener("resize", () => createGameForContainer());
        document.getElementById("toggleDir").onclick = () =>
          window.crosswordScene && window.crosswordScene.toggleDirection();
        document.getElementById("nextBtn").onclick = () => alert("Puzzle solved!");
      });
    </script>
  </body>
</html>
